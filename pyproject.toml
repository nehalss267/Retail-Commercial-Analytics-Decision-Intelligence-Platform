[project]
name = "retailai"
version = "0.1.0"
description = "AI-powered commercial decision intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",

    # Statistics
    "scipy>=1.12",
    "statsmodels>=0.14",

    # Machine Learning
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",

    # Forecasting
    "prophet>=1.1",

    # Visualization
    "plotly>=5.19",
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # Dashboard
    "streamlit>=1.32",

    # GenAI
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langgraph>=0.2",

    # Vector Store
    "chromadb>=0.5",

    # MLOps
    "mlflow>=2.12",

    # Utilities
    "loguru>=0.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
